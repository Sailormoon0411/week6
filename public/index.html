
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Book Search</title>
</head>

<body>
  <h1>Book Search</h1>

  <h2>Search Book by ID</h2>
  <input type="number" id="bookId" placeholder="Enter book ID">
  <button onclick="searchBook()">Search</button>
  <button onclick="loadBooks()">Show All Books</button>

  <h2>Results</h2>
  <div id="result"></div>

  <script>
    const result = document.getElementById("result");

    // Display all books
    async function loadBooks() {
      const response = await fetch("/data");
      const books = await response.json();

      result.innerHTML = "";

      books.forEach(book => {
        const div = document.createElement("div");
        div.innerHTML = `
          <p>ID: ${book.id}</p>
          <p>Title: ${book.title}</p>
          <p>Author: ${book.author}</p>
          <p>Genre: ${book.genre}</p>
          <p>Publication Year: ${book.year}</p>
          <hr>
        `;
        result.appendChild(div);
      });
    }

    // Search for a book by ID
    async function searchBook() {
      const bookId = document.getElementById("bookId").value;

      if (!bookId) {
        result.textContent = "Please enter a book ID.";
        return;
      }

      const response = await fetch(`/data/${bookId}`);
      const book = await response.json();

      result.innerHTML = "";

      if (!response.ok) {
        result.textContent = book.error;
        return;
      }

      const div = document.createElement("div");
      div.innerHTML = `
        <p>ID: ${book.id}</p>
        <p>Title: ${book.title}</p>
        <p>Author: ${book.author}</p>
        <p>Genre: ${book.genre}</p>
        <p>Publication Year: ${book.year}</p>
      `;
      result.appendChild(div);
    }

    // Load all books when the page opens
    loadBooks();
  </script>
</body>

</html>
